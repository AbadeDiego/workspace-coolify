:root {
  --ink: #182235;
  --muted: #7c8595;
  --blue: #2865e8;
  --line: #e8ebf0;
  --bg: #f8fafc;
  --green: #25947c;
  --red: #c95656;
  --radius: 12px;
  font:
    14px/1.5 Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: var(--ink);
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: white;
  color: var(--ink);
  font-weight: 550;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 12px;
  min-height: 36px;
  transition:
    background 0.15s,
    border-color 0.15s;
}
button:hover {
  background: #f3f6fa;
  border-color: #cdd5e1;
}
button:disabled {
  opacity: 0.5;
  cursor: wait;
}
button svg {
  width: 15px;
  height: 15px;
  flex: none;
}
input,
select,
textarea {
  width: 100%;
  background: #fff;
  border: 1px solid #dce2ea;
  border-radius: 7px;
  padding: 9px 11px;
  min-height: 38px;
  color: var(--ink);
}
textarea {
  min-height: 100px;
  resize: vertical;
}
input::placeholder,
textarea::placeholder {
  color: #9aa2b1;
}
input[type="checkbox"] {
  width: 16px;
  height: 16px;
  min-height: 16px;
  accent-color: var(--blue);
  flex: none;
}
label {
  font-size: 12px;
  color: #4e5a70;
  display: block;
  font-weight: 550;
}
label > input,
label > select,
label > textarea {
  margin-top: 6px;
}
input:focus,
select:focus,
textarea:focus {
  outline: 3px solid #2865e81a;
  border-color: #76a1f1;
}
button:focus-visible,
a:focus-visible {
  outline: 3px solid #99b8f8;
  outline-offset: 2px;
}
a {
  color: var(--blue);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
.hidden {
  display: none !important;
}
.primary {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
  box-shadow: 0 2px 3px #2865e819;
}
.primary:hover {
  background: #1c55cf;
  border-color: #1c55cf;
}
.quiet {
  background: transparent;
}
.danger {
  color: var(--red);
  background: #fff6f6;
  border-color: #f7dcdc;
}
.success {
  color: #197b63;
  background: #eaf7f2;
  border-color: #d2ebe2;
}
.small {
  font-size: 11px;
  min-height: 29px;
  padding: 5px 9px;
}
.wide {
  width: 100%;
}
.icon-btn {
  width: 34px;
  min-width: 34px;
  height: 34px;
  padding: 8px;
  background: transparent;
  border-color: transparent;
  color: #778295;
}
.icon-btn:hover {
  background: #eef2f7;
  border-color: transparent;
}
.icon-btn svg {
  width: 18px;
  height: 18px;
  stroke-width: 1.7;
}
.layout {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  height: 100dvh;
  position: sticky;
  top: 0;
  background: #fff;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 26px 16px 15px;
}
.identity {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px 24px;
}
.brand {
  display: flex;
  gap: 10px;
  align-items: center;
}
.brand-mark {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  background: #1d2e4d;
  color: #fff;
  border-radius: 9px;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -3px;
  padding-right: 3px;
  line-height: 1;
}
.brand b {
  font-size: 17px;
  letter-spacing: -0.7px;
}
.brand small {
  display: block;
  font-size: 10px;
  color: #929aa8;
  margin-top: 0;
}
.collapse-btn {
  width: 24px;
  min-width: 24px;
  padding: 4px;
}
.collapse-btn svg {
  width: 15px;
  height: 15px;
}
.workspace-label {
  border: 1px solid var(--line);
  border-radius: 7px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px;
  font-size: 10px;
  font-weight: 550;
  color: #566074;
  margin-bottom: 24px;
}
.workspace-label > svg {
  margin-left: auto;
  width: 12px;
  height: 12px;
  color: #a2a9b7;
}
.workspace-dot {
  width: 7px;
  height: 7px;
  background: #6185b5;
  border-radius: 2px;
}
.sidebar nav {
  overflow: auto;
  scrollbar-width: thin;
  flex: 1;
}
.nav-group {
  font-size: 9px;
  letter-spacing: 1.5px;
  color: #a0a7b4;
  margin: 0 12px 8px;
  font-weight: 650;
}
.nav-group:not(:first-child) {
  margin-top: 24px;
}
.nav-btn {
  width: 100%;
  display: flex;
  justify-content: flex-start;
  gap: 11px;
  text-align: left;
  background: transparent;
  border: 0;
  color: #727d8d;
  font-size: 12px;
  min-height: 38px;
  padding: 9px 12px;
  margin: 2px 0;
  border-radius: 6px;
  font-weight: 500;
  white-space: nowrap;
}
.nav-btn svg {
  width: 16px;
  height: 16px;
  stroke-width: 1.6;
}
.nav-btn:hover {
  background: #f6f8fb;
  color: #223047;
}
.nav-btn.active {
  background: #edf3ff;
  color: #2a61d7;
  font-weight: 600;
}
.nav-count {
  margin-left: auto;
  font-size: 10px;
  background: #dfeaff;
  padding: 1px 5px;
  border-radius: 4px;
}
.side-footer {
  border-top: 1px solid var(--line);
  padding-top: 14px;
  margin-top: 18px;
}
.profile-btn {
  border: 0;
  padding: 8px 4px;
  text-align: left;
  width: 100%;
  justify-content: flex-start;
  gap: 10px;
}
.profile-btn > svg {
  margin-left: auto;
  width: 13px;
  color: #9aa4b3;
}
.profile-btn b {
  font-size: 11px;
  display: block;
}
.profile-btn small {
  display: block;
  font-size: 9px;
  color: #99a2b0;
  font-weight: 400;
}
.avatar {
  background: #e9eef6;
  border: 1px solid #dde4ef;
  color: #4e6588;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  min-height: 32px;
  min-width: 32px;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 600;
  padding: 0;
  overflow: hidden;
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.logout-btn {
  border: 0;
  background: none;
  color: #99a2b0;
  font-size: 10px;
  justify-content: flex-start;
  margin-left: 2px;
  padding: 8px;
}
.logout-btn svg {
  width: 13px;
}
.page-wrap {
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 74px;
  background: #ffffffec;
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 15;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 11px;
  white-space: nowrap;
}
.crumb-root {
  color: #949cab;
}
.slash {
  color: #ccd1db;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 13px;
}
.search-trigger {
  border: 0;
  color: #99a2b1;
  background: transparent;
  font-size: 10px;
  padding: 6px 0;
  gap: 9px;
}
.search-trigger svg {
  width: 14px;
}
.search-trigger kbd {
  font: 9px inherit;
  border: 1px solid #e1e6ed;
  padding: 1px 4px;
  border-radius: 4px;
  margin-left: 10px;
}
.top-divider {
  width: 1px;
  height: 19px;
  background: var(--line);
  margin: 0 4px;
}
.top-actions select {
  width: auto;
  max-width: 190px;
  font-size: 10px;
  font-weight: 550;
  min-height: 32px;
  padding: 5px 25px 5px 9px;
  background: #fff;
}
.top-actions .icon-btn {
  width: 29px;
  min-width: 29px;
}
.notification-button {
  position: relative;
}
.notification-button > span {
  position: absolute;
  right: 6px;
  top: 5px;
  width: 5px;
  height: 5px;
  background: #ed9f5c;
  border-radius: 50%;
  border: 1px solid white;
}
.page-wrap main {
  padding: 31px 34px 25px;
  max-width: 1720px;
  width: 100%;
  margin: 0 auto;
  flex: 1;
}
.eyebrow {
  font-size: 9px;
  letter-spacing: 1.7px;
  color: #99a2b0;
  font-weight: 600;
}
.page-intro {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 24px;
}
.page-intro h2 {
  font-size: 26px;
  letter-spacing: -1px;
  line-height: 1.3;
  margin: 5px 0 7px;
  font-weight: 620;
}
.page-intro p {
  margin: 0;
  font-size: 11px;
  color: #8c95a4;
}
.page-intro .actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.period-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 19px;
}
.segmented {
  display: inline-flex;
  background: #eef1f5;
  padding: 3px;
  border-radius: 7px;
  gap: 2px;
}
.segmented button {
  font-size: 10px;
  min-height: 28px;
  border: 0;
  background: transparent;
  color: #8892a3;
  padding: 4px 11px;
  font-weight: 500;
}
.segmented button.active {
  background: #fff;
  color: #364661;
  box-shadow: 0 1px 3px #1c304815;
}
.date-range {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  color: #758298;
}
.date-range input {
  font-size: 10px;
  width: 125px;
  min-height: 30px;
  padding: 4px 7px;
}
.scope-note {
  font-size: 9px;
  color: #9ba4b3;
  display: flex;
  align-items: center;
  gap: 6px;
}
.scope-note svg {
  width: 12px;
  height: 12px;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.kpi,
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 2px 5px #1d345402;
  min-width: 0;
}
.kpi {
  padding: 19px 20px 17px;
}
.kpi-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.kpi .label {
  font-size: 10px;
  color: #7c879a;
  font-weight: 500;
}
.kpi-icon {
  color: #a4b2c5;
}
.kpi-icon svg {
  width: 15px;
  height: 15px;
  stroke-width: 1.6;
}
.kpi strong {
  font-size: 29px;
  font-weight: 600;
  display: block;
  margin: 11px 0 8px;
  line-height: 1.15;
  letter-spacing: -1px;
  overflow-wrap: anywhere;
}
.kpi small {
  font-size: 9px;
  color: #a0a8b5;
  display: flex;
  gap: 5px;
  align-items: center;
}
.kpi small svg {
  width: 11px;
  height: 11px;
}
.kpi small.positive {
  color: var(--green);
}
.kpi small.negative {
  color: var(--red);
}
.metric-strip {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  padding: 16px 4px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  margin-bottom: 20px;
}
.mini-metric {
  padding: 0 16px;
  border-left: 1px solid var(--line);
}
.mini-metric:first-child {
  border: 0;
}
.mini-metric small {
  font-size: 9px;
  color: #929baa;
  display: block;
  margin-bottom: 5px;
}
.mini-metric b {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.3px;
}
.cols {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 20px;
}
.grid2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}
.grid3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.card {
  margin-bottom: 20px;
  overflow: hidden;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 19px 21px 0;
  gap: 12px;
}
.card-head h3 {
  margin: 0;
  font-size: 12px;
  letter-spacing: -0.15px;
  font-weight: 600;
}
.card-head p {
  font-size: 9px;
  color: #9aa3b0;
  margin: 3px 0 0;
}
.card-head .icon-btn {
  height: 24px;
  min-height: 24px;
  width: 24px;
  min-width: 24px;
}
.card-body {
  padding: 19px 21px;
}
.card > .table-wrap {
  padding-top: 14px;
}
.card .card-body:has(.table-wrap) {
  padding: 14px 0 0;
}
.text-link {
  border: 0;
  background: none;
  padding: 0;
  min-height: 24px;
  color: var(--blue);
  font-size: 10px;
}
.text-link:hover {
  background: none;
  color: #164dae;
}
.text-link svg {
  width: 12px;
  height: 12px;
}
.table-wrap {
  overflow: auto;
  max-width: 100%;
}
.data-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 10px;
  text-align: left;
}
.data-table th {
  background: #fafbfc;
  padding: 11px 20px;
  font-size: 9px;
  font-weight: 500;
  color: #9aa3b3;
  white-space: nowrap;
  border-bottom: 1px solid var(--line);
}
.data-table td {
  padding: 14px 20px;
  border-bottom: 1px solid #f0f2f6;
  vertical-align: middle;
  max-width: 290px;
  overflow-wrap: anywhere;
}
.data-table tbody tr:last-child td {
  border-bottom: 0;
}
.data-table tbody tr:hover {
  background: #fcfdff;
}
.sort-button {
  padding: 0;
  min-height: 18px;
  font-size: 9px;
  color: inherit;
  border: 0;
  background: transparent;
  justify-content: flex-start;
}
.sort-button svg {
  width: 10px;
  height: 10px;
  color: #bdc5d1;
}
.data-table td b {
  font-size: 10px;
  font-weight: 550;
}
.table-sub {
  font-size: 9px;
  color: #a0a8b6;
  margin-top: 3px;
}
.startup-ident {
  display: flex;
  align-items: center;
  gap: 10px;
}
.startup-icon {
  width: 29px;
  height: 29px;
  min-width: 29px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  font-size: 10px;
  font-weight: 600;
  color: var(--company, #5479a2);
  background: color-mix(in srgb, var(--company, #5479a2) 10%, white);
  border: 1px solid color-mix(in srgb, var(--company, #5479a2) 12%, white);
}
.tag,
.priority {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  padding: 3px 6px;
  font-size: 9px;
  font-weight: 500;
  border-radius: 4px;
  background: #f0f3f7;
  color: #7f8b9d;
}
.tag::before {
  content: "";
  height: 4px;
  width: 4px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.7;
}
.tag.ok {
  background: #eaf6f1;
  color: #39947c;
}
.tag.warn {
  background: #fff5e9;
  color: #c28e4c;
}
.tag.bad {
  background: #fdf0f0;
  color: #c97070;
}
.tag.blue {
  background: #edf3ff;
  color: #6289cf;
}
.priority::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.priority.urgente {
  color: #c96a72;
  background: #fcf0f0;
}
.priority.alta {
  color: #bd9358;
  background: #fcf5e8;
}
.priority.media {
  color: #6c8ec2;
  background: #eef3fc;
}
.priority.baixa {
  color: #72a08b;
  background: #eef8f2;
}
.progress {
  height: 5px;
  width: 100%;
  background: #f0f2f6;
  border-radius: 10px;
  overflow: hidden;
}
.progress > div {
  height: 100%;
  background: #78a0eb;
  border-radius: 10px;
}
.progress-text {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 9px;
  color: #98a4b5;
}
.progress-text .progress {
  max-width: 110px;
}
.muted {
  color: var(--muted);
}
.tiny {
  font-size: 10px;
}
.flex {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.task {
  padding: 14px 0;
  border-bottom: 1px solid #f0f2f5;
}
.task:last-child {
  border-bottom: 0;
}
.task b {
  font-size: 10px;
  font-weight: 550;
}
.task-meta {
  font-size: 9px;
  color: #a0a9b8;
  margin-top: 5px;
}
.task-check {
  width: 15px;
  height: 15px;
  min-width: 15px;
  border-radius: 4px;
  border: 1px solid #dfe5ee;
  min-height: 15px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #6c9b86;
}
.task-check svg {
  width: 10px;
  height: 10px;
}
.task-main {
  display: flex;
  align-items: center;
  gap: 10px;
}
.due-alert {
  color: #cb7373 !important;
}
.due-soon {
  color: #c39961 !important;
}
.team-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #f0f2f6;
}
.team-row:last-child {
  border: 0;
}
.team-row .avatar {
  width: 27px;
  height: 27px;
  min-width: 27px;
  min-height: 27px;
  font-size: 9px;
}
.team-row .team-name {
  flex: 1;
}
.team-name b {
  font-size: 10px;
  font-weight: 550;
  display: block;
}
.team-name small {
  font-size: 9px;
  color: #a7afbb;
}
.team-score {
  text-align: right;
  font-size: 11px;
}
.team-score small {
  display: block;
  color: #acb4c0;
  font-size: 8px;
}
.chart-legend {
  display: flex;
  gap: 12px;
  font-size: 9px;
  color: #a2aab7;
  align-items: center;
}
.chart-legend span {
  display: flex;
  align-items: center;
  gap: 5px;
}
.chart-legend i {
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: #749aeb;
}
.chart-legend span:nth-child(2) i {
  background: #ccd6e7;
}
.line-chart {
  width: 100%;
  height: 210px;
  display: block;
  overflow: visible;
}
.line-chart text {
  font-family: inherit;
  fill: #a7b1bf;
  font-size: 8px;
}
.chart-topline {
  display: flex;
  gap: 30px;
  margin-bottom: 12px;
}
.chart-topline strong {
  font-size: 19px;
  font-weight: 550;
  display: block;
  letter-spacing: -0.5px;
}
.chart-topline small {
  font-size: 9px;
  color: #9ca5b3;
  display: block;
  margin-bottom: 2px;
}
.bar-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.bar-row {
  display: flex;
  align-items: center;
  gap: 13px;
  font-size: 10px;
}
.bar-row > span {
  width: 92px;
  color: #7e899b;
}
.bar-row > .progress {
  flex: 1;
  height: 7px;
}
.bar-row > b {
  font-size: 10px;
  color: #6d7c91;
  font-weight: 500;
  min-width: 24px;
  text-align: right;
}
.goal-row {
  padding: 12px 0;
  border-bottom: 1px solid #f0f2f6;
}
.goal-row:last-child {
  border: 0;
}
.goal-row b {
  font-size: 10px;
  font-weight: 500;
}
.goal-row .between {
  margin-bottom: 7px;
}
.goal-row small {
  font-size: 9px;
  color: #9da6b4;
}
.goal-row .progress {
  height: 4px;
}
.empty {
  text-align: center;
  padding: 28px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: #a3adbb;
  font-size: 10px;
}
.empty svg {
  width: 24px;
  height: 24px;
  stroke-width: 1.3;
  color: #b6c5db;
}
.empty b {
  color: #768599;
  font-size: 11px;
  font-weight: 500;
}
.empty p {
  margin: 0;
  max-width: 300px;
  font-size: 10px;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin: 16px 0;
}
.filter-group {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}
.filter-group select,
.filter-group input {
  width: auto;
  max-width: 210px;
  min-height: 32px;
  padding: 6px 9px;
  font-size: 10px;
}
.toolbar-search {
  position: relative;
}
.toolbar-search input {
  padding-left: 30px;
  width: 225px;
}
.toolbar-search svg {
  position: absolute;
  left: 9px;
  top: 10px;
  width: 12px;
  height: 12px;
  color: #9ca8b9;
}
.pagination {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--line);
  padding: 11px 20px;
  font-size: 9px;
  color: #a2aab7;
  gap: 10px;
}
.pagination button {
  padding: 3px 8px;
  min-height: 26px;
  font-size: 9px;
}
.pagination .flex {
  gap: 5px;
}
.pipeline {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(200px, 1fr);
  overflow-x: auto;
  gap: 12px;
  padding: 3px 0 20px;
  scroll-snap-type: x mandatory;
}
.lane {
  padding: 11px;
  background: #f1f4f8;
  border: 1px solid #e9edf3;
  border-radius: 9px;
  min-height: 300px;
  scroll-snap-align: start;
}
.lane.hover {
  outline: 2px solid #9db9f4;
  background: #edf3ff;
}
.lane-head {
  display: flex;
  align-items: center;
  gap: 7px;
  justify-content: space-between;
  font-size: 10px;
  font-weight: 550;
  color: #6d7b90;
  margin: 2px 1px 14px;
}
.lane-head .count {
  font-size: 9px;
  color: #a5aebe;
  padding: 1px 5px;
  background: #e7ecf3;
  border-radius: 4px;
}
.lead-card {
  border: 1px solid #e4e9f1;
  background: #fff;
  border-radius: 8px;
  padding: 13px;
  margin: 10px 0;
  box-shadow: 0 2px 3px #22344f03;
}
.lead-card[draggable="true"] {
  cursor: grab;
}
.lead-card b {
  font-size: 10px;
  font-weight: 550;
  display: block;
}
.lead-card p {
  font-size: 9px;
  color: #9ca6b5;
  margin: 5px 0 12px;
}
.lead-card .card-divider {
  height: 1px;
  background: #f1f3f7;
  margin: 10px -1px;
}
.lead-card select {
  font-size: 9px;
  padding: 4px 6px;
  margin-top: 10px;
  min-height: 27px;
  color: #8494aa;
}
.lead-card .lead-value {
  font-size: 11px;
  font-weight: 550;
  color: #5d7292;
}
.lane-empty {
  font-size: 9px;
  color: #b0b9c7;
  text-align: center;
  padding: 20px 3px;
  border: 1px dashed #dfe5ee;
  border-radius: 7px;
}
.board-task {
  cursor: pointer;
}
.board-task .priority {
  margin-top: 10px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.form-grid .full {
  grid-column: 1/-1;
}
.form-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 23px;
  padding-top: 17px;
  border-top: 1px solid var(--line);
}
.form-actions button {
  font-size: 11px;
}
.form-error {
  color: var(--red);
  font-size: 11px;
  margin: 10px 0;
}
.notice {
  padding: 12px 15px;
  border: 1px solid #dbe7f8;
  background: #f1f6ff;
  font-size: 10px;
  color: #6d8bb9;
  border-radius: 8px;
  margin: 15px 0;
}
.goal-card {
  padding: 20px;
}
.goal-card h3 {
  font-size: 12px;
  margin: 0;
}
.goal-card .goal-value {
  font-size: 28px;
  font-weight: 550;
  margin: 14px 0;
  letter-spacing: -1px;
}
.goal-card .goal-value span {
  font-size: 13px;
  color: #a8b2c1;
}
.goal-card .progress {
  margin: 14px 0 8px;
}
.section-label {
  font-size: 10px;
  font-weight: 600;
  color: #78889d;
  margin: 22px 0 10px;
}
.calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 1px;
  background: #e9edf2;
  border: 1px solid #e9edf2;
  border-radius: 8px;
  overflow: hidden;
}
.cal-heading {
  background: #fafbfd;
  font-size: 9px;
  padding: 8px;
  text-align: center;
  color: #9ba6b6;
}
.cal-day {
  min-height: 96px;
  background: #fff;
  padding: 9px;
  font-size: 9px;
  color: #9ba6b6;
}
.cal-day.today {
  background: #f7faff;
}
.cal-day.today > b {
  background: #6f96e8;
  color: #fff;
  padding: 2px 5px;
  border-radius: 4px;
}
.cal-event {
  display: block;
  width: 100%;
  background: #edf3fd;
  color: #7b99c6;
  margin-top: 6px;
  font-size: 8px;
  border: 0;
  border-radius: 4px;
  padding: 4px;
  min-height: 20px;
  overflow: hidden;
  text-align: left;
  justify-content: flex-start;
  text-overflow: ellipsis;
}
.person-card {
  padding: 20px;
}
.person-card h3 {
  font-size: 13px;
  margin: 0;
}
.person-card small {
  font-size: 10px;
  color: #9ba5b4;
}
.person-card .avatar {
  width: 40px;
  height: 40px;
  min-width: 40px;
  font-size: 13px;
}
.person-card .membership-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 17px 0;
}
.checklist-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 0;
  border-bottom: 1px solid #eff2f6;
  font-size: 11px;
  color: #6c7b92;
}
.checklist-row.done span {
  text-decoration: line-through;
  color: #a3b0bf;
}
.history-item {
  border-left: 1px solid #dfe7f1;
  margin-left: 5px;
  padding: 0 0 18px 18px;
  position: relative;
  font-size: 10px;
  color: #8e9bad;
}
.history-item:before {
  content: "";
  position: absolute;
  left: -3px;
  top: 5px;
  background: #b5c7e0;
  width: 5px;
  height: 5px;
  border-radius: 50%;
}
.history-item b {
  color: #66788f;
  font-weight: 500;
}
.history-item small {
  display: block;
  font-size: 9px;
  color: #abb5c2;
  margin-top: 4px;
}
.history-changes {
  font-size: 9px;
  white-space: pre-wrap;
  margin-top: 5px;
  overflow-wrap: anywhere;
  color: #8594aa;
}
.comment {
  background: #f8fafc;
  padding: 13px;
  border-radius: 7px;
  font-size: 11px;
  margin: 9px 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.comment small {

/* Visualization system v1. All modules use these tokens and shared primitives.
   Add new charts through temporalChart/barList/progress/kpi; semantic colors via VIZ.
   Numeric values, scales, aggregation and filters belong to the existing data layer. */
:root {
  --viz-blue:#4385E8; --viz-green:#27A879; --viz-amber:#D99A35;
  --viz-red:#D96A6A; --viz-purple:#8971D0; --viz-gray:#98A2B3;
  --viz-ink:#202939; --viz-muted:#626D7E; --viz-surface:#fff;
  --viz-soft:#F8FAFC; --viz-line:#E9EDF2; --viz-track:#EFF2F6;
  --viz-success-ink:#18734F; --viz-warning-ink:#8C621B; --viz-danger-ink:#A64040;
  --viz-radius:16px; --viz-shadow:0 2px 8px #20293904,0 1px 2px #20293903;
  --viz-duration:240ms; --viz-ease:cubic-bezier(.2,.7,.2,1);
  --blue:var(--viz-blue); --green:var(--viz-green); --red:var(--viz-red);
}
body,button,input,select,textarea {font-family:Inter,system-ui,-apple-system,sans-serif}
.kpi,.card,.metric-strip,.goal-card,.person-card {
  background:var(--viz-surface);border:1px solid var(--viz-line);
  border-radius:var(--viz-radius);box-shadow:var(--viz-shadow);
}
.kpi {--viz-accent:var(--viz-blue);padding:22px 24px;transition:background var(--viz-duration),box-shadow var(--viz-duration),border-color var(--viz-duration)}
.kpi .label,.mini-metric small,.chart-topline small {color:var(--viz-muted);font-weight:500;line-height:1.5}
.kpi-head {gap:12px;align-items:flex-start}
.kpi-icon {display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:10px;color:var(--viz-accent);background:var(--viz-soft)}
.kpi-icon svg {width:18px;height:18px;stroke-width:1.7}
.kpi strong,.chart-topline strong,.goal-card .goal-value>strong {color:var(--viz-ink);font-weight:600;font-size:32px;letter-spacing:-1px;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small {color:var(--viz-muted);font-size:13px;line-height:1.5}
.kpi small.positive,.positive {color:var(--viz-success-ink)}
.kpi small.negative,.negative {color:var(--viz-danger-ink)}
.mini-metric b,.team-score,.lead-value {color:var(--viz-ink);font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.metric-strip {padding:20px 4px}
.mini-metric,.mini-metric.dashboard-link {border-left-color:var(--viz-line)}
.card-head h2,.card-head h3,.card h2,.person-card h2,.goal-card h2 {font-weight:600;color:var(--viz-ink);letter-spacing:-.25px}
.card-head p,.goal-row small,.goal-card .tiny,.team-score small {color:var(--viz-muted)}
button.dashboard-link:hover {background:var(--viz-soft);border-color:#D9E1EB}
button.kpi.dashboard-link:hover {box-shadow:0 4px 16px #20293908}
.dashboard-arrow {color:var(--viz-gray);transition:color var(--viz-duration)}
.dashboard-link:hover .dashboard-arrow {color:var(--viz-blue)}
button.dashboard-link:focus-visible,[data-viz-tooltip]:focus-visible,.chart-point:focus-visible {outline:2px solid var(--viz-blue);outline-offset:4px}
.progress {height:8px;border-radius:999px;background:var(--viz-track);overflow:hidden;min-width:0}
.progress>div,.progress>span,.dashboard-bar .progress>span {
  display:block;height:100%;border-radius:inherit;background:var(--viz-accent,var(--viz-blue));
  transform-origin:left center;animation:viz-grow 500ms var(--viz-ease) both;
  transition:width 450ms var(--viz-ease),background var(--viz-duration);
}
.bar-list {gap:20px;padding:4px 0}
.bar-row {display:grid;grid-template-columns:minmax(100px,1fr) minmax(70px,1.35fr) auto;gap:16px;align-items:center;font-size:13px;min-width:0}
.bar-row>span {width:auto;color:var(--viz-muted);overflow-wrap:anywhere;line-height:1.5}
.bar-row>.progress {width:100%;height:10px}
.bar-row>b {color:var(--viz-ink);font-weight:600;font-size:14px;min-width:28px;font-variant-numeric:tabular-nums}
.dashboard-bar.dashboard-link {padding:8px 28px 8px 8px;border-radius:8px;min-height:44px}
.goal-row {border-bottom-color:var(--viz-line);padding:18px 0}
.goal-row .progress,.goal-card .progress,.delivery-progress .progress {height:8px}
.goal-row .goal-outcome,.delivery-progress .between>b {font-weight:600;color:var(--viz-ink);font-variant-numeric:tabular-nums}
.data-chart {margin:0;min-width:0;color:var(--viz-ink)}
.data-chart figcaption>b {font-size:15px;font-weight:600;letter-spacing:-.2px;color:var(--viz-ink)}
.data-chart figcaption>span {color:var(--viz-muted);font-size:12px;line-height:1.6;margin-top:6px}
.chart-series-labels,.chart-legend {display:flex;flex-wrap:wrap;gap:10px 20px;color:var(--viz-muted);font-size:12px;line-height:1.5}
.chart-series-labels {margin:20px 0 12px}
.chart-series-labels>span,.chart-legend>span {display:inline-flex;gap:8px;align-items:center}
.chart-series-labels i,.chart-legend i,.chart-legend span:nth-child(2) i {display:block;flex:none;width:9px;height:9px;border-radius:3px;background:var(--series-color,var(--viz-blue))}
.chart-canvas {position:relative;min-width:0;width:100%;height:268px}
.temporal-svg {display:block;width:100%;max-width:100%;height:268px;overflow:hidden}
.temporal-svg text {font-family:Inter,system-ui,sans-serif;font-size:11px;fill:var(--viz-muted);font-variant-numeric:tabular-nums}

.chart-grid {stroke:var(--viz-line);stroke-width:1;stroke-dasharray:none}
.chart-zero {stroke:#CBD3DF;stroke-width:1}
.chart-line {stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;animation:viz-appear 450ms var(--viz-ease) both}
.chart-mark {animation:viz-appear 450ms var(--viz-ease) both;transition:opacity var(--viz-duration)}
.chart-hit {transition:fill var(--viz-duration)}
.chart-point:hover .chart-hit,.chart-point:focus .chart-hit {fill:#4385E80A}
.chart-point.point-selected .chart-hit {fill:#4385E809}
.chart-point.point-selected>text {fill:var(--viz-ink);font-weight:600}
.chart-point:focus {outline:none}
.chart-point:focus-visible .chart-hit {stroke:var(--viz-blue);stroke-width:1.5}
.chart-point circle {transition:r var(--viz-duration)}
.chart-point:hover circle,.chart-point:focus-visible circle {r:5}
.chart-inspector {display:grid;grid-template-columns:auto minmax(130px,1fr);gap:10px 12px;align-items:center;margin-top:12px;padding:16px;background:var(--viz-soft);border:1px solid var(--viz-line);border-radius:12px}
.chart-inspector>label {color:var(--viz-muted);font-size:12px;font-weight:500}
.chart-inspector select {min-height:38px;font-size:12px;background:var(--viz-surface);border:1px solid #DDE3EB;border-radius:8px}
.chart-inspector output {grid-column:1/-1;font-size:12px;color:var(--viz-ink);line-height:1.7;font-variant-numeric:tabular-nums}
.chart-instruction {font-size:12px;line-height:1.6;color:var(--viz-muted);margin:12px 0}
.chart-data summary {color:#3168B6;font-size:12px;font-weight:500;padding:10px 0;min-height:38px}
.chart-data .table-wrap {border:1px solid var(--viz-line);border-radius:10px}
.chart-data-table th,.chart-data-table td {font-size:12px;padding:12px 14px}
.chart-data-table tbody tr:last-child>* {border-bottom:0}
.commercial-trends>.data-chart+.data-chart {border-color:var(--viz-line)}
.viz-tooltip {position:fixed;z-index:10000;pointer-events:none;box-sizing:border-box;width:max-content;max-width:min(320px,calc(100vw - 24px));padding:12px 14px;background:#fff;color:var(--viz-ink);border:1px solid #E3E8EF;border-radius:12px;box-shadow:0 8px 30px #20293918,0 2px 6px #20293908;font:12px/1.7 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:pre-line;overflow-wrap:anywhere}
.viz-tooltip[hidden] {display:none}
.viz-tooltip::first-line {font-weight:600}
.tag {background:#F0F3F7;color:var(--viz-muted);border:0;border-radius:6px}
.tag.ok {background:#27A87912;color:var(--viz-success-ink)}
.tag.warn {background:#D99A3515;color:var(--viz-warning-ink)}
.tag.bad {background:#D96A6A14;color:var(--viz-danger-ink)}
.tag.blue {background:#4385E812;color:#3168B6}
.empty {padding:36px 20px;color:var(--viz-muted)}
.empty>svg {color:var(--viz-gray);width:28px;height:28px;stroke-width:1.5}
.empty b {color:var(--viz-ink);font-weight:600}
.empty p {color:var(--viz-muted);max-width:38ch}
.skeleton {border-radius:10px;background:linear-gradient(100deg,#F0F3F7 30%,#FAFBFD 50%,#F0F3F7 70%);background-size:220% 100%;animation:viz-shimmer 1.7s ease-in-out infinite}
@keyframes viz-grow {from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes viz-appear {from{opacity:0}to{opacity:1}}
@keyframes viz-shimmer {from{background-position:100% 0}to{background-position:-100% 0}}

    padding-top: max(28px, env(safe-area-inset-top));
    padding-bottom: max(28px, env(safe-area-inset-bottom));
  }

  .table-wrap > .stacked-table { display: block; width: 100%; min-width: 0; }
  .stacked-table thead {
    position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
  .stacked-table thead .sort-button { display: none; }
  .stacked-table thead .table-heading-label { display: inline; }
  .stacked-table tbody, .stacked-table tbody tr { display: block; }
  .stacked-table tbody tr {
    border: 1px solid var(--viz-line);
    border-radius: 12px;
    padding: 5px 12px;
    margin-bottom: 10px;
    background: var(--viz-surface);
  }
  .stacked-table tbody td {
    display: grid;
    grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr);
    gap: 10px;
    align-items: baseline;
    padding: 9px 0;
    max-width: none;
    text-align: left !important;
    font-size: 14px;
  }
  .stacked-table tbody td[colspan], .stacked-table tbody td[data-label=""] { display: block; }
  .stacked-table tbody td:last-child { border-bottom: 0; }
  .stacked-table tbody tr:last-child td:not(:last-child) { border-bottom: 1px solid var(--viz-line); }
  .stacked-table tbody td::before {
    content: attr(data-label);
    color: var(--viz-muted);
    font-size: 12px;
    font-weight: 600;
  }
  .stacked-table tbody td[data-label=""]::before, .stacked-table tbody td[colspan]::before { content: none; }
  .stacked-table .table-cell-value { min-width: 0; overflow-wrap: anywhere; }
  .stacked-table .table-cell-value button { min-height: 44px; max-width: 100%; text-align: left; }
  .mobile-table-sort { display: block; margin: 0 0 12px; }
  .mobile-table-sort select { width: 100%; }
  .table-wrap > .data-table:not(.stacked-table) { min-width: min-content; }
  .table-wrap > .data-table:not(.stacked-table) th { white-space: normal; }
  .table-wrap > .chart-data-table { min-width: 0 !important; table-layout: fixed; }
  .chart-data-table th, .chart-data-table td { padding: 8px 5px; overflow-wrap: anywhere; }
  .pipeline { grid-auto-columns: minmax(0, 88%); overscroll-behavior-inline: contain; }
  .lane { min-height: 0; }
  .calendar-wrap { display: none; }
  .calendar-agenda { display: block; }
  .calendar-agenda .cal-event {
    display: flex; align-items: center; width: 100%; text-align: left;
    margin-top: 5px; white-space: normal; overflow-wrap: anywhere;
  }
  .calendar-agenda-day + .calendar-agenda-day { margin-top: 14px; }
}

@media screen and (max-width: 360px) {
  .kpis, .material-tabs { grid-template-columns: minmax(0, 1fr); }
  .chart-inspector, .date-range { grid-template-columns: minmax(0, 1fr); }
}

    <main id="login" class="login-wrap" aria-labelledby="login-title">

          <label for="login-email">E-mail
            <input id="login-email" type="email" name="email" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="login-error" required>

          <button type="submit" class="primary wide" disabled>
            <span id="login-submit-label">Entrar</span> <i data-lucide="arrow-right"></i>
          </button>
        </form>
      </section>
    </main>
    <div id="shell" class="layout hidden">
      <aside class="sidebar" id="sidebar">
        <div class="identity">

            <span class="brand-mark">w.</span>
            <div><b>Workspace</b><small>Multi-startup</small></div>
